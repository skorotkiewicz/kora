[package]
name = "kora"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Desktop folder browsing for Niri and EWMH-compatible X11"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "config.example.toml", "docs/**"]

[dependencies]
gdk4-x11 = "0.10"
gtk4 = { version = "0.10", features = ["v4_8"] }
gtk4-layer-shell = "0.7"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
x11rb = "0.13"
